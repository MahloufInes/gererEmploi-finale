spring.application.name=edt-backend

# ===== Server =====
server.port=${PORT:8081}

# ===== MySQL Database =====
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/edt?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# ===== JSON =====
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

# ===== Error Handling =====
server.error.include-message=never
server.error.include-stacktrace=never

# ===== Logging =====
logging.level.root=INFO
logging.level.org.springframework.web=INFO

# ===== JWT =====
jwt.secret=${JWT_SECRET:dev-only-secret-change-me-at-least-32-chars-long}
jwt.expiration=86400000